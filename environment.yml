name: propygator
channels:
  - conda-forge
dependencies:
  - python=3.11
  - openjdk=17
  - orekit_jpype=13.1.*
  - jpype1=1.5.*
  - numpy=2.*
  - pandas=3
  - matplotlib
  - plotly
  # IANA tz database module for zoneinfo (Windows ships no system copy); the
  # PyPI name is "tzdata" — plain conda "tzdata" is the raw data, no module.
  - python-tzdata
  - jupyterlab=4.5.*
  - pip
  - pip:
      - -e .[dev]
