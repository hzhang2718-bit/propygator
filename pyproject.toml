[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "propygator"
version = "0.1.0"
description = "Orbital simulation and satellite tracking, built on Orekit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henry Zhang", email = "282068036+hzhang2718-bit@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "plotly",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit", "nbstripout"]

[project.urls]
Homepage = "https://github.com/hzhang2718-bit/propygator"
Repository = "https://github.com/hzhang2718-bit/propygator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type checkers honor propygator's types.
propygator = ["py.typed"]

[tool.pytest.ini_options]
# Only collect propygator's own tests. Without this, a bare `pytest` from the
# repo root recurses into the vendored ./orekit-data/ tree and tries to import
# its PyInstaller test module (architecture treats orekit-data as an external
# dependency, not project code).
testpaths = ["tests"]
# Disable pytest's faulthandler plugin. Once the JVM is up (stack-compat tests
# and, later, every Orekit-touching test), HotSpot deliberately raises and
# handles access violations / SIGSEGV internally — implicit null checks,
# safepoint polling, and JVM teardown at interpreter exit. faulthandler can't
# tell those normal signals from a real crash, so it prints a spurious "fatal
# exception: access violation" traceback at shutdown (seen on Windows; exit code
# stays 0 and all tests pass). Disabling the plugin is the standard, portable
# configuration for JVM-backed suites and avoids faulthandler converting a
# benign JVM signal into a fatal abort on Linux CI. The standalone JVM smoke
# path proves the teardown itself is clean. Scoping the disable tighter is not
# possible: pytest configures faulthandler once per invocation, and the
# pure-Python tests share that invocation with the JVM tests.
addopts = ["-p", "no:faulthandler"]

[tool.ruff]
# Tell ruff (and its isort) which directories hold first-party code (src layout).
src = ["src", "tests", "scripts"]
line-length = 88
target-version = "py311"
# experiments/ holds exploratory reference code kept verbatim (it mirrors an
# external sandbox run); exclude it from lint + format. The ruff pre-commit hooks
# pass --force-exclude, so this is honored even when those files are staged.
extend-exclude = ["experiments"]

[tool.ruff.lint]
# ruff subsumes flake8 (E/F/W) and isort (I); ruff-format subsumes black. Kept
# intentionally focused on the architecture's "flake8/black/isort" mapping;
# broader rule families (UP, B, ...) are a deliberate, separate pass.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["propygator"]

[tool.mypy]
python_version = "3.11"
# Type-gate the shipped package and the utility script. Tests are exercised by
# pytest, not type-gated: py.typed is a promise about src/ to consumers.
files = ["src", "scripts"]
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The JPype-generated Java namespaces (org.orekit.*, java.*) and the JPype/Orekit
# wrappers carry no type information; pandas 3 and requests likewise expose no
# stubs mypy can resolve in this environment. Treat them as untyped — this is the
# "ignore_missing_imports for the org.orekit.* runtime-stub namespace" called for
# in architecture §6.
module = [
    "jpype",
    "jpype.*",
    "orekit_jpype",
    "orekit_jpype.*",
    "org.orekit.*",
    "java",
    "java.*",
    "pandas",
    "pandas.*",
    "plotly",
    "plotly.*",
    "requests",
    "requests.*",
    # Generation-only deps for scripts/generate_sphere_cd_table.py (not in the
    # runtime env; imported lazily there). See scripts/requirements-generate.txt.
    "scipy",
    "scipy.*",
    "pymsis",
    "pymsis.*",
]
ignore_missing_imports = true
